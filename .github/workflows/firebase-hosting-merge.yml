name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - kemetx
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    container: node:20
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup node"
        run: yarn install --force

      - name: "Build"
        run: npm run build:test

      - name: "Serve the application"
        run: |
          /bin/bash -c "yarn serve" &
          sleep 10  # Wait for the server to start

      - name: "Deploy to Firebase Hosting"
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEMETX_F8E5B }}
          channelId: live
          projectId: kemetx-f8e5b
          site: kemetx-f8e5b-b96cc
          hostingRegion: us-central1
    env:
      FIREBASE_CLI_EXPERIMENTS: webframeworks
      apiBaseUrl: https://piglet-engaging-mako.ngrok-free.app
      sdkBaseUrl: https://piglet-engaging-mako.ngrok-free.app/payments
