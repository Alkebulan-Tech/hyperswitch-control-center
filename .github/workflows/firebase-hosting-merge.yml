name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - kemetx
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Rust"
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: "Build Rust to WebAssembly"
        working-directory: ./config
        run: cargo build --target wasm32-unknown-unknown --release

      - name: "Move Wasm Files to Hosting Directory"
        run: |
          mkdir -p public/wasm
          cp target/wasm32-unknown-unknown/release/*.wasm public/wasm/
          echo '<html><body><script type="module">import("./wasm/your_project_name_bg.wasm");</script></body></html>' > public/index.html

      - name: "Install Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Install Firebase Tools"
        run: npm install -g firebase-tools

      - name: "Deploy to Firebase Hosting"
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEMETX_F8E5B }}
          channelId: live
          projectId: kemetx-f8e5b
          site: kemetx-f8e5b-b96cc
          hostingRegion: us-central1
    env:
      FIREBASE_CLI_EXPERIMENTS: webframeworks
      apiBaseUrl: https://piglet-engaging-mako.ngrok-free.app
      sdkBaseUrl: https://piglet-engaging-mako.ngrok-free.app/payments
